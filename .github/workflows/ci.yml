name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Clippy and the tests run on both, because the code behind cfg(target_os = "linux") has a
      # fallback on macOS that nothing else compiles. Format, docs and shellcheck read the same
      # files either way, so Linux alone runs them.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # Warning and above: the info-level findings are cleanup functions run by trap and the
      # quickstart's stand-ins that the scripts call through eval, which shellcheck cannot see.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning scripts/*.sh

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: overlay-bn ships without lighthouse_network
        if: runner.os == 'Linux'
        run: |
          if cargo tree -p overlay-bn -e normal | grep -E '(^|[[:space:]])lighthouse_network v[0-9]'; then
            echo "lighthouse_network is a production dependency of overlay-bn; D38 keeps it a dev-dependency, for the cross-check tests only"
            exit 1
          fi

  deploy-examples:
    name: deployment examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # systemd-analyze verify treats a missing ExecStart= command as an error, so the path the
      # unit starts has to exist. Nothing runs it, so a stand-in is enough.
      - name: Put a stand-in where the unit's ExecStart= points
        run: |
          printf '#!/bin/sh\nexit 1\n' | sudo tee /usr/local/bin/eth-gossip-overlay > /dev/null
          sudo chmod 755 /usr/local/bin/eth-gossip-overlay

      - name: Units, sysctl, nftables template and examples
        run: cargo test -p eth-gossip-overlay --test deploy

      - name: Check the rendered allowlist with nft
        run: |
          if command -v nft > /dev/null; then
            sudo nft -c -f deploy/nftables/eth-gossip-overlay.nft.example
          else
            echo "nft is not installed on this runner, skipping the ruleset check"
          fi

  observability:
    name: alert rules, dashboard and rollout guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # promtool comes out of the Prometheus image, so there is nothing to install and the
      # version is whatever a current Prometheus ships. The Rust checks below find it the same
      # way, and skip where a host has neither it nor a docker daemon.
      - name: promtool on the alert rules
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool \
            prom/prometheus:latest check rules deploy/prometheus/alerts.yml

      - name: Observability tests
        run: cargo test -p eth-gossip-overlay --test observability

  container:
    name: container image and demo
    runs-on: ubuntu-latest
    steps:
      # Not shallow: build.rs reads the commit date out of .git for SOURCE_DATE_EPOCH, which is
      # what makes two builds of one commit produce one binary.
      - uses: actions/checkout@v7

      # Builds the image and runs T-047's checks against it: check-config on the shipped
      # examples, a non-root user, the size budget, a node key that survives its container, and
      # the compose demo reaching a full mesh. Nothing is pushed; T-048 owns that.
      - name: Image and compose checks
        run: scripts/container-checks.sh

  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      # The whole history, because the check is a diff against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A change to a crate's src/ that says nothing in CHANGELOG.md leaves the release notes
      # with a hole in them. skip-changelog on the pull request is the way to say there is
      # nothing an operator would read.
      - name: A change to the code is a change an operator can read about
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: scripts/changelog.sh check "$BASE" HEAD

  deny:
    name: cargo deny
    # One vCPU and a fifteen-minute cap. Nothing here compiles, but cargo metadata still fetches
    # the registry and the Lighthouse checkout, which the cache keeps between runs, and the
    # image ships no rustup, so the toolchain goes on by hand. A run that hits the cap sends
    # the job back to ubuntu-latest.
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deny-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deny-

      - name: Install rustup and the toolchain pinned in rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      # cargo-deny-action is a Docker action, and ubuntu-slim is a container with no Docker
      # daemon to build it on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny check licenses advisories bans sources

  links:
    name: markdown links
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path target '**/*.md'
          fail: true
