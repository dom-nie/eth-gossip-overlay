name: Fleet at scale

# The nightly runs: too slow, or too dependent on a public network, for a pull request.
#
# T-051's fleet harness with thirty hosts per scenario instead of three to six, the compose demo
# with the three real beacon nodes a newcomer starts, and the alert rules against that demo.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fleet:
    name: N=30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # One scenario at a time: thirty sidecars and thirty fake beacon nodes is enough for one
      # runner to hold, and eleven of those at once is not.
      - name: Scenarios at thirty hosts
        run: cargo test -p eth-gossip-overlay --test fleet_v1 -- --test-threads=1
        env:
          FLEET_NODES: 30

  compose:
    name: compose demo with beacon nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pull-request job starts the sidecars alone, which proves the mesh. This one starts
      # the demo a newcomer starts: three Lighthouse nodes checkpoint syncing a testnet, and
      # overlay_bn_trusted at 1 on every sidecar. It then runs T-053 check 3, the quickstart's
      # own verification commands against that demo. Three beacon nodes at once is more than a
      # runner comfortably holds, so a failure here is worth reading before it is believed.
      - name: The demo with real beacon nodes
        run: scripts/container-checks.sh --with-beacon-nodes

  alerts:
    name: alerts fire in the compose demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # T-052 check 6. Breaks the demo in one way the rules are meant to notice and waits for
      # the alert to go pending: one sidecar stopped.
      - name: Stop a sidecar
        run: scripts/alert-checks.sh
