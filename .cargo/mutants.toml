# cargo-mutants, for the two pure crates (T-009, MD-02), run under cargo-nextest (T-123, MD-13):
#
#   cargo install cargo-mutants@27.1.0 cargo-nextest --locked
#   cargo mutants -p overlay-core
#   cargo mutants -p overlay-transport
#
# No file exclusions are configured, and none are needed: cargo-mutants already skips items
# marked `#[cfg(test)]`, `#[test]` or `#[tokio::test]`, so the `#[cfg(test)]` trees and the
# `testutil` and `conformance` modules behind them are never mutated, and integration test
# targets such as overlay-bn's `tests/matrix.rs` are not mutated either. `cargo mutants
# --list-files` is the check. Code that cannot be tested from this suite carries
# `#[cfg_attr(test, mutants::skip)]` with its reason, so the skip is visible where the code is.

# nextest runs each test in its own process and stops at the first failure, so a mutant that
# breaks every QUIC handshake fails in seconds rather than making each of the transport crate's
# tokio tests wait out its bound before the binary reports. `.config/nextest.toml` kills any one
# test at 30 s, which is what ends a test awaiting something that never comes.
test_tool = "nextest"

# The floor under the bound on one crate's whole nextest run, which cargo-mutants otherwise
# sets at five times the unmutated run. The transport suite runs real QUIC handshakes on
# loopback, and a shared CI runner can stall one for longer than the arithmetic suggests; a
# mutant that looks like a timeout has to be triaged by hand. A minute of headroom is cheaper
# than that.
minimum_test_timeout = 60.0

# Two mutants that no attribute can reach: cargo-mutants takes `#[mutants::skip]` on an item or
# on a few expression kinds, and neither of these is one. Both join two nibbles that occupy
# disjoint bits, `(high << 4) | low`, where `^` and `|` compute the same byte for every input,
# so the mutant changes nothing a test could observe. The `| with &` and `<< with >>` mutants of
# the same two lines are caught, and the rest of both functions stays under test.
exclude_re = [
  "replace \\| with \\^ in decode_hex",
  "replace \\| with \\^ in fork_digest",
  # Spins forever in-process. With `&&`, an expired front entry short-circuits past
  # `drop_oldest`, so the reassembler's expiry loop never advances. Only nextest's 30 s kill
  # ends it, which is a deadline and not a test of behaviour (MD-02), and each such mutant
  # costs up to 30 s. The two `delete !` mutants on the same line stay in the run.
  "replace \\|\\| with && in State::expire",
  # Spins forever in-process. `expire` and `trim_bytes` loop on this answer, and a constant
  # `true` that pops nothing never ends. Excluded by name rather than skipped on the function,
  # because `drop_oldest`'s other mutants are under test.
  "replace State::drop_oldest -> bool with true",
  # NLM_F_REQUEST (1) and NLM_F_ACK (4) are disjoint bits, so `^` and `|` give the same flags
  # for the same reason as the two nibble joins above. `| with &` on the same line is caught.
  "replace \\| with \\^ in netlink::napi_set_request",
  # T-124. The three feature bits are `bit(0)`, `bit(1)` and `bit(2)`, disjoint, so `^` and `|`
  # give the same `SUPPORTED_FEATURES`. cargo-mutants 27.1.0 ignores `mutants::skip` on a const.
  "protocol\\.rs:\\d+:\\d+: replace \\| with \\^$",
  # `open` is the only insert and runs this loop before each one, so the count is at most
  # `max_in_flight` when the loop starts and one drop ends it with or without the `!`. The two
  # differ only at `max_in_flight == 0`, where the mutant spins; the sidecar always builds the
  # reassembler with `MAX_IN_FLIGHT`.
  "delete ! in State::open",
  # `k` is a `u16`, so `k >= 0` admits only `k == 0` beyond `k > 0`. With no parity such a
  # header has no indices and is a `HeaderConflict` before `usable` is asked; with parity
  # `rs::supports(0, m)` on the same expression refuses it. Anchored on the column, because the
  # same mutation of `chunk_bytes > 0` one line down is caught.
  "reassemble\\.rs:\\d+:14: replace > with >= in usable",
  # `start` is only ever used modulo the pool's length, and `(h + len) mod len == h mod len`.
  # The one difference is an overflow panic for a hash within `len` of `u64::MAX`. Anchored on
  # the column: the `%` that reduces the walk on the next line is caught.
  "relay\\.rs:\\d+:47: replace % with \\+ in select",
  "stripe\\.rs:\\d+:35: replace % with \\+ in assign",
  # When `start == end` the copy is of an empty slice, which does nothing.
  "rs\\.rs:\\d+:\\d+: replace < with <= in data_chunk",
  # Calls `stale_dropped` with 0, which adds nothing to the counter.
  "batching\\.rs:\\d+:\\d+: replace > with >= in send$",
  "sender\\.rs:\\d+:\\d+: replace > with >= in send_batch",
  # The counter's value is never read: its one reader waits on `changed()`, and `send_modify`
  # notifies whatever the closure does. MD-04 describes it as a `watch<u64>`, so the type stays.
  "replace \\+= with \\*= in OwnTopics::intern",
]

# The one file the `#[cfg(test)]` rule above does not cover. `overlay-transport`'s `testutil` is
# behind `cfg(any(test, feature = "test-util"))`, because E3 and E5 link the same `TestCluster`
# from their own test binaries, and that `any` is enough for cargo-mutants to read it as
# production code. It is scaffolding: a mutant in it can only make a fixture wrong, which the
# suite using the fixture reports as its own failure, or not at all.
exclude_globs = ["crates/overlay-transport/src/testutil.rs"]
