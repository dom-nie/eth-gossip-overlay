# The demo's sidecar config, shared by all three sidecars.
#
# Everything not named here is the shipped default, which already suits a container: the overlay
# listens on [::]:7788, and because each sidecar shares its beacon node's network namespace, the
# beacon node is reachable on 127.0.0.1 exactly as it is on a bare-metal host.

overlay:
  # One seed for the fleet, on the volume the init container writes it to. On a real host this
  # is /etc/eth-gossip-overlay/seed, delivered as a systemd credential.
  fleet_seed_file: /shared/seed

bn:
  # The libp2p identity the beacon node trusts. It is on a named volume, so a restarted
  # container keeps its peer id and the beacon node keeps trusting it (D01). This is also the
  # default path; the demo says it out loud because the volume is the point.
  node_key_file: /var/lib/eth-gossip-overlay/node.key

# The image has a /run/eth-gossip-overlay of its own, but `docker compose exec` reaches the
# socket by path and the beacon node's container reads the lighthouse.env file, so both go on
# the node key's volume instead. RUNTIME_DIRECTORY in docker-compose.yml points the second one
# there.
admin_socket: /var/lib/eth-gossip-overlay/admin.sock

# Prometheus scrapes from its own container, so the endpoint cannot be on loopback. The sidecar
# warns about that at startup and it is the right warning: only the demo's private bridge
# network reaches this port.
metrics_listen: 0.0.0.0:7789
