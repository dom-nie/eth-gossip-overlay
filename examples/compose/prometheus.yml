# Every sidecar on the demo network, at the port D30 fixed. Five seconds because the whole point
# of watching this demo is seeing a counter move.
global:
  scrape_interval: 5s
  # Fast enough that an alert this demo is meant to show goes pending while you are watching.
  evaluation_interval: 5s

# deploy/prometheus/alerts.yml, mounted by docker-compose.yml. The rules and their state are at
# http://127.0.0.1:9090/alerts.
rule_files:
  - /etc/prometheus/rules/eth-gossip-overlay.yml

scrape_configs:
  - job_name: eth-gossip-overlay
    static_configs:
      - targets: ["sc-1:7789", "sc-2:7789", "sc-3:7789"]
