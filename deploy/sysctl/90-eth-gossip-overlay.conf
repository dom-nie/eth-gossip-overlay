# Ceilings, not allocations: the overlay endpoint asks for 8 MiB send and receive buffers and
# gets what the kernel allows. The beacon node's own sockets are unaffected by a higher ceiling.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Pacing for QUIC.
net.core.default_qdisc = fq

# The flow table receive flow steering reads, for hosts whose NIC has no ntuple rule to steer
# UDP 7788 to the sidecar's core.
net.core.rps_sock_flow_entries = 32768
