# cargo deny check licenses advisories bans sources
#
# The checked graph is the workspace's normal dependency graph: dev-dependencies such as
# lighthouse_network are not walked, but cargo metadata unifies their features onto crates the
# workspace also uses, which is how reqwest's TLS tree reaches the licence check below.

[advisories]
ignore = [
  # `paste` is an unmaintained proc-macro. It enters through netlink-packet-core (libp2p's if-watch,
  # Linux only) and alloy-primitives (Lighthouse's crates); no newer compatible version of either
  # drops it, so nothing in this workspace can fix it.
  { id = "RUSTSEC-2024-0436", reason = "paste is pinned by libp2p's if-watch and by Lighthouse's alloy-primitives; not fixable from this workspace" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
exceptions = [
  # Mozilla's root store, under a data licence. cargo metadata unifies Lighthouse's rustls-tls
  # feature onto the reqwest this workspace uses with json only, so cargo deny walks into it;
  # no build of the binaries links it (cargo tree -p overlay-bn -e normal has no TLS crate).
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  # A Keccak under a public-domain dedication, which Lighthouse's network_utils uses and
  # nothing of ours does. It reaches the check through lighthouse_network, a dev-dependency
  # (D38); no build of the binaries links it (cargo tree -p eth-gossip-overlay -e normal -i
  # tiny-keccak prints nothing).
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]
# Lighthouse's internal crates carry no `license` field. They inherit the Apache-2.0 LICENSE at
# the root of the repository, at the rev the lock pins for v8.2.3,
# 6db6ae9382b7d6f5bd1e0ca0d349bc0dc94adba2. The list is what `cargo deny check licenses` named;
# a Lighthouse bump that pulls in another one shows up as a new unlicensed error here.
clarify = [
  { crate = "bls", expression = "Apache-2.0", license-files = [] },
  { crate = "clap_utils", expression = "Apache-2.0", license-files = [] },
  { crate = "directory", expression = "Apache-2.0", license-files = [] },
  { crate = "eip_3076", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2_config", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2_interop_keypairs", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2_key_derivation", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2_keystore", expression = "Apache-2.0", license-files = [] },
  { crate = "eth2_network_config", expression = "Apache-2.0", license-files = [] },
  { crate = "fixed_bytes", expression = "Apache-2.0", license-files = [] },
  { crate = "int_to_bytes", expression = "Apache-2.0", license-files = [] },
  { crate = "kzg", expression = "Apache-2.0", license-files = [] },
  { crate = "lighthouse_network", expression = "Apache-2.0", license-files = [] },
  { crate = "lighthouse_version", expression = "Apache-2.0", license-files = [] },
  { crate = "logging", expression = "Apache-2.0", license-files = [] },
  { crate = "lru_cache", expression = "Apache-2.0", license-files = [] },
  { crate = "merkle_proof", expression = "Apache-2.0", license-files = [] },
  { crate = "metrics", expression = "Apache-2.0", license-files = [] },
  { crate = "network_utils", expression = "Apache-2.0", license-files = [] },
  { crate = "pretty_reqwest_error", expression = "Apache-2.0", license-files = [] },
  { crate = "proto_array", expression = "Apache-2.0", license-files = [] },
  { crate = "swap_or_not_shuffle", expression = "Apache-2.0", license-files = [] },
  { crate = "task_executor", expression = "Apache-2.0", license-files = [] },
  { crate = "types", expression = "Apache-2.0", license-files = [] },
  { crate = "workspace_members", expression = "Apache-2.0", license-files = [] },
]

[bans]
# Lighthouse's tree pins older rand, hkdf and ed25519-dalek next to the versions this workspace
# uses, and cannot be unified from here.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/sigp/lighthouse",
  "https://github.com/sigp/rust-libp2p",
  # Declared in workspace.dependencies and rewritten by the [patch] table to sigp's fork, so the
  # lock never carries it; cargo deny reports the entry as unmatched, which is expected.
  "https://github.com/libp2p/rust-libp2p",
]
