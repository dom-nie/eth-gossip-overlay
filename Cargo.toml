[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dom-nie/eth-bn-gossip-overlay"

[workspace.dependencies]
overlay-core = { path = "crates/overlay-core" }
overlay-transport = { path = "crates/overlay-transport" }
overlay-bn = { path = "crates/overlay-bn" }

# Lighthouse v8.2.2. Bumping Lighthouse means changing this tag, the sigp/rust-libp2p rev in the
# patch table at the bottom, and rerunning T-018's compatibility matrix.
lighthouse_network = { git = "https://github.com/sigp/lighthouse.git", tag = "v8.2.2" }
types = { git = "https://github.com/sigp/lighthouse.git", tag = "v8.2.2", features = ["saturating-arith"] }
libp2p = { git = "https://github.com/libp2p/rust-libp2p.git", default-features = false, features = ["tcp", "noise", "yamux", "identify", "gossipsub", "gossipsub-partial-messages", "request-response", "metrics", "tokio", "macros"] }
# The version Lighthouse's discv5 already resolves to, so the sidecar signs the records the
# beacon node parses. The sidecar only signs with ed25519, but `CombinedKey` and the
# `ed25519_dalek` re-export that names the dalek version the crate signs with are both behind
# `all(ed25519, k256)`, so k256 comes along. Without it the crate compiles and neither type can
# be named; a test build hides that, because Lighthouse's own discv5 turns k256 on.
enr = { version = "0.13", default-features = false, features = ["ed25519", "k256"] }

tokio = "1"
# No platform-verifier: the overlay pins peer keys and must never reach for a system trust store.
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring", "bloom"] }
# One crypto provider for the whole workspace, ring, which is also quinn's. Two providers in one
# binary make CryptoProvider::get_default() depend on link order. TLS 1.2 never runs under QUIC.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
arc-swap = "1"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2"
url = { version = "2", features = ["serde"] }
bytes = "1"
sha2 = "0.11"
snap = "1"
hkdf = "0.13"
ed25519-dalek = "3"
zeroize = "1"
reed-solomon-simd = "3"
prometheus = "0.14"
prometheus-client = "0.24"
# hyper 1 ships its runtime bridge and its body helpers as separate crates and is not usable
# as a server without them.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# The stdout writer the single log stream goes through, so a slow reader on the other end of
# the pipe never blocks a receive path (D32).
tracing-appender = "0.2"
sd-notify = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.10"

proptest = "1"
# `gethostname` for the sidecar's own identity (T-003 keeps it out of overlay-core), and raising
# a real SIGHUP at a test process, which is the only way to prove the signal loop is wired to
# the handler. fleet-overlay alone.
nix = { version = "0.29", features = ["signal"] }
# The no-op #[mutants::skip] attribute cargo-mutants reads (T-009). A dev-dependency, not a
# normal one: every use is inside cfg_attr(test, ...), so nothing but a test build sees it.
mutants = "0.0.4"
ethereum_ssz = "0.10"
strum = "0.27"
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Copied verbatim from Lighthouse v8.2.2's root Cargo.toml so libp2p resolves to the fork revision
# the beacon node itself compiles. Patches only take effect in the workspace root.
[patch."https://github.com/libp2p/rust-libp2p.git"]
libp2p = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-mplex = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-quic = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
