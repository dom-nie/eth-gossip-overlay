[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
overlay-core = { path = "crates/overlay-core" }
overlay-transport = { path = "crates/overlay-transport" }
overlay-bn = { path = "crates/overlay-bn" }

tokio = "1"
quinn = "0.11"
rustls = "0.23"
rcgen = "0.14"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
bytes = "1"
sha2 = "0.11"
snap = "1"
hkdf = "0.13"
ed25519-dalek = "3"
zeroize = "1"
reed-solomon-simd = "3"
prometheus = "0.14"
prometheus-client = "0.25"
hyper = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sd-notify = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.10"

proptest = "1"
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
