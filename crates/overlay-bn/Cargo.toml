[package]
name = "overlay-bn"
description = "The link to the local Lighthouse beacon node: gossipsub, req/resp, HTTP API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The custody column decoder and the tracker wiring behind it (T-083). It is the one place the
# overlay reads a consensus object, so it is the one place `types` is a production dependency
# (D05); `cargo tree -p overlay-bn -e normal` lists it only with this on. The binary enables it.
column-repair = ["dep:types"]

# The optional by-root cache over the beacon node's own req/resp (§5.8, T-085). It reads two
# consensus request bodies out of SSZ, so it needs `types` and the SSZ decoder that goes with it,
# and it needs the column index `column-repair`'s decoder fills. `cargo tree -p overlay-bn -e
# normal` lists neither `ethereum_ssz` nor `lighthouse_network` without this.
by-root-cache = ["column-repair", "dep:ethereum_ssz"]

# `FakeBn` and its helpers, for the fleet harness in `eth-gossip-overlay` (T-051). Lighthouse's own
# crates come with it, so nothing but a test build may turn it on: the harness enables it
# through a dev-dependency, which resolver 3 never unifies into a normal build.
test-util = [
    "dep:ethereum_ssz",
    "dep:lighthouse_network",
    "dep:types",
    "dep:sha2",
    "dep:tempfile",
    "dep:wiremock",
]

[dependencies]
enr.workspace = true
ethereum_ssz = { workspace = true, optional = true }
libp2p.workspace = true
lighthouse_network = { workspace = true, optional = true }
overlay-core.workspace = true
prometheus-client.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
snap.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
types = { workspace = true, optional = true }
unsigned-varint.workspace = true
url.workspace = true
wiremock = { workspace = true, optional = true }

[dev-dependencies]
ethereum_ssz.workspace = true
overlay-bn = { workspace = true, features = ["test-util"] }
proptest.workspace = true
strum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
