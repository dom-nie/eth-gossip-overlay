[package]
name = "fleet-overlay"
description = "Sidecar binary for a private gossip overlay between Lighthouse beacon nodes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
overlay-bn.workspace = true
overlay-core.workspace = true
overlay-transport.workspace = true
prometheus = { workspace = true, features = ["process"] }
prometheus-client.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[bin]]
name = "fleet-overlay"
path = "src/bin/fleet-overlay.rs"

[[bin]]
name = "fleet-overlayctl"
path = "src/bin/fleet-overlayctl.rs"

[lints]
workspace = true
