[package]
name = "eth-gossip-overlay"
description = "Sidecar binary for a private gossip overlay between Lighthouse beacon nodes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
nix = { workspace = true, features = ["hostname"] }
# `column-repair` promotes `types` to a production dependency of `overlay-bn` and turns on the
# gossip payload decoder custody column repair needs (D05, T-083). This is the only crate that
# asks for it; `cargo tree -p overlay-bn -e normal` lists `types` only when it is on.
overlay-bn = { workspace = true, features = ["column-repair"] }
overlay-core.workspace = true
overlay-transport.workspace = true
prometheus = { workspace = true, features = ["process"] }
prometheus-client.workspace = true
sd-notify.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml_bw.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd.workspace = true
bytes.workspace = true
minijinja.workspace = true
overlay-bn = { workspace = true, features = ["test-util"] }
overlay-transport = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[[bin]]
name = "eth-gossip-overlay"
path = "src/bin/eth-gossip-overlay.rs"

[[bin]]
name = "eth-gossip-overlayctl"
path = "src/bin/eth-gossip-overlayctl.rs"

[lints]
workspace = true
